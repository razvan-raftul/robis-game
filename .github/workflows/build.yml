name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install wxPython pyinstaller accessible_output2 certifi
      - name: Pregatire
        shell: python
        run: |
          import glob, os, shutil
          open("build_info.py", "w").write("BUILD = %s\n" % os.environ["GITHUB_RUN_NUMBER"])
          try:
              import accessible_output2
              d = os.path.dirname(accessible_output2.__file__)
              found = [p for p in glob.glob(os.path.join(d, "**", "*.dll"), recursive=True) if "nvda" in p.lower() and "64" in p]
              if found:
                  shutil.copy(found[0], "nvdaControllerClient64.dll")
          except Exception as e:
              print("fara dll", e)
          print(os.listdir("."))
      - name: Compilare
        shell: pwsh
        run: |
          $extra = @()
          if (Test-Path nvdaControllerClient64.dll) { $extra = @("--add-binary", "nvdaControllerClient64.dll;.") }
          pyinstaller --noconfirm --onefile --windowed --name RobisGame --collect-data certifi @extra main.py
      - name: Publicare
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python -c "import version; print(version.VERSION)"
          Copy-Item dist/RobisGame.exe dist/JocuriAccesibile.exe
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          try { Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Romanian.isl" -OutFile Romanian.isl } catch { Write-Host "fara romana" }
          $c = Get-Content installer.iss -Raw -Encoding utf8
          [IO.File]::WriteAllText("$PWD\installer.iss", $c, (New-Object Text.UTF8Encoding $true))
          & $iscc "/DAppVersion=$v" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          gh release create "v$v" dist/RobisGame.exe dist/JocuriAccesibile.exe dist/RobisGameSetup.exe --title "Versiunea $v" --notes "Versiune nouă, se instalează singură."
