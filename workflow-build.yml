name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install wxPython pyinstaller accessible_output2
      - name: Pregatire
        shell: python
        run: |
          import glob, os, shutil
          open("build_info.py", "w").write("BUILD = %s\n" % os.environ["GITHUB_RUN_NUMBER"])
          try:
              import accessible_output2
              d = os.path.dirname(accessible_output2.__file__)
              found = [p for p in glob.glob(os.path.join(d, "**", "*.dll"), recursive=True) if "nvda" in p.lower() and "64" in p]
              if found:
                  shutil.copy(found[0], "nvdaControllerClient64.dll")
          except Exception as e:
              print("fara dll", e)
          print(os.listdir("."))
      - name: Compilare
        shell: pwsh
        run: |
          $extra = @()
          if (Test-Path nvdaControllerClient64.dll) { $extra = @("--add-binary", "nvdaControllerClient64.dll;.") }
          pyinstaller --noconfirm --onefile --windowed --name JocuriAccesibile @extra main.py
      - name: Publicare
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python -c "import version; print(version.VERSION)"
          gh release create "v$v" dist/JocuriAccesibile.exe --title "Versiunea $v" --notes "Versiune nouă, se instalează singură."
